name: Build LeverLight (Forge 1.20.1)

on:
  workflow_dispatch:
  push:
    paths:
      - 'mods/LeverLight/**'
      - '.github/workflows/leverlight-build.yml'
  pull_request:
    paths:
      - 'mods/LeverLight/**'
      - '.github/workflows/leverlight-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Forge 1.20.1 / Java 17
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build Forge mod
        working-directory: mods/LeverLight
        run: gradle --no-daemon --stacktrace build
      - name: Verify JAR contents
        run: |
          JAR='mods/LeverLight/build/libs/leverlight-forge-1.20.1-1.0.0.jar'
          test -f "$JAR"
          jar tf "$JAR" | grep -Fx 'META-INF/mods.toml'
          jar tf "$JAR" | grep -Fx 'assets/leverlight/dynamiclights/item/control_lever.json'
          jar tf "$JAR" | grep -Fx 'data/leverlight/recipes/control_lever.json'
          jar tf "$JAR" | grep -Fx 'com/fuschia/leverlight/LeverLightMod.class'
      - name: Upload installable JAR
        uses: actions/upload-artifact@v4
        with:
          name: LeverLight-Forge-1.20.1-Installable-JAR
          path: mods/LeverLight/build/libs/leverlight-forge-1.20.1-1.0.0.jar
          if-no-files-found: error
